<script>
(function initNavbar() {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupNavbarEventListeners);
  } else {
    setupNavbarEventListeners();
  }

  function setupNavbarEventListeners() {
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    const allNavLinks = document.querySelectorAll('.nav-links a');
    allNavLinks.forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPage) {
        link.classList.add('active');
      }
    });

    const navToggle = document.getElementById('navToggle');
    const navMenu = document.getElementById('navMenu');

    if (navToggle && navMenu) {
      const newToggle = navToggle.cloneNode(true);
      navToggle.parentNode.replaceChild(newToggle, navToggle);
      const newMenu = navMenu.cloneNode(true);
      navMenu.parentNode.replaceChild(newMenu, navMenu);

      const finalToggle = document.getElementById('navToggle');
      const finalMenu = document.getElementById('navMenu');

      if (finalToggle && finalMenu) {
        finalToggle.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          finalMenu.classList.toggle('active');
          finalToggle.classList.toggle('active');
          document.body.classList.toggle('mobile-nav-active');
        });
      }
    }

    document.querySelectorAll('.nav-links a, .nav-cta-mobile').forEach(link => {
      link.addEventListener('click', function() {
        const mobileMenu = document.getElementById('navMenu');
        const mobileToggle = document.getElementById('navToggle');
        if (mobileMenu) mobileMenu.classList.remove('active');
        if (mobileToggle) mobileToggle.classList.remove('active');
        document.body.classList.remove('mobile-nav-active');
      });
    });

    document.querySelectorAll('.dropdown > a').forEach(dropdownLink => {
      dropdownLink.addEventListener('click', function(e) {
        if (window.innerWidth <= 1024) {
          e.preventDefault();
          const dropdown = this.parentElement;
          dropdown.classList.toggle('active');
        }
      });
    });

    // Hide entire header wrapper (top bar + header) on scroll,
    // show it again only when back at the very top of the page
    const wrapper = document.getElementById('siteHeaderWrapper');

    if (wrapper) {
      window.addEventListener('scroll', function() {
        if (window.pageYOffset > 10) {
          wrapper.classList.add('hidden');
        } else {
          wrapper.classList.remove('hidden');
        }
      });
    }
  }
})();
</script>
